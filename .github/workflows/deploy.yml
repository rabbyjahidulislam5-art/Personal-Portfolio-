name: Deploy Flutter Portfolio

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Verify Build Files
        run: |
          test -f build/web/index.html
          grep -Fq "<base href=\"/${GITHUB_REPOSITORY#*/}/\">" build/web/index.html
          test -f build/web/flutter_bootstrap.js
          test -f build/web/flutter_service_worker.js
          test -f build/web/main.dart.js
          test -f build/web/assets/AssetManifest.bin
          test -f build/web/assets/assets/profile.png
          test -f build/web/assets/fonts/MaterialIcons-Regular.otf
          test -f build/web/manifest.json
          test -f build/web/favicon.png
          test -f build/web/icons/Icon-192.png
          test -f build/web/canvaskit/canvaskit.js
          test -f build/web/canvaskit/canvaskit.wasm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Website
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

      - name: Deploy Website
        id: deployment
        uses: actions/deploy-pages@v4
